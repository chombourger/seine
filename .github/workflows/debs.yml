name: Debian packages

on:
  push:
    branches: [ master, next ]
    tags: [ '*' ]
  pull_request:
    branches: [ master, next ]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      # podman (even just pull/tag/save, no 'run') still clones/re-execs
      # itself; Docker's default capability set blocks that even as root
      # inside the job container, so it needs full privileges here.
      options: --privileged
    env:
      # podman only pulls/tags/saves images here, never runs one -- vfs
      # needs no extra container capabilities, unlike the overlay default.
      STORAGE_DRIVER: vfs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Bootstrap container (checkout needs git)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all python3-pip \
            python3-setuptools podman

      - name: Build ${{ matrix.arch }} packages
        run: dpkg-buildpackage -b -uc -a ${{ matrix.arch }}

      - name: Collect .deb files
        run: |
          mkdir -p debs
          mv ../*.deb debs/

      - uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          path: debs
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: debs/*.deb
