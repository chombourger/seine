distribution:
    release: trixie
    architecture: amd64

multiconfig:
    initrd:
        - examples/minimal-initrd/main.yaml
        - examples/pc-uki-image/kernel.yaml
    uki:
        files:
            - examples/minimal-uki/main.yaml
        after:
            - initrd
    image:
        files:
            - examples/pc-uki-image/image.yaml
        after:
            - uki

imager:
    boot: image

image:
    filename: pc-uki.img
    table: gpt
    secure-boot:
        private-key: vault:pc-uki-secureboot
    partitions:
        - label: esp
          type: vfat
          size: 256MiB
          source: image
          where: /efi
          flags: [boot]
        - label: xbootldr
          type: vfat
          size: 512MiB
          source: image
          where: /boot
          flags: [xbootldr]
        - label: var
          type: ext4
          size: 1024MiB
          source: image
          where: /var
        - label: usr
          type: erofs
          size: 2048MiB
          source: image
          where: /usr
          verity: true
        - label: usr-verity
          type: verity-hash
          size: 64MiB
          source: image
          verity-for: usr
        - label: root
          type: ext4
          size: 1536MiB
          source: image
          where: /
