# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier Apache-2.0

# A real-PC-sized disk chaining initrd -> UKI -> rootfs in one 'seine
# build' call (multiconfig: after:, docs/building.md). Signed with a
# throwaway test key ('keys/'); Secure Boot still needs to be off.
#   seine build examples/pc-uki-image/main.yaml
#   dd if=build/deploy/trixie/pc-uki.img of=/dev/sdX bs=4M status=progress conv=fsync

distribution:
    release: trixie
    architecture: amd64

multiconfig:
    initrd:
        - examples/minimal-initrd/main.yaml
    uki:
        files:
            - examples/minimal-uki/main.yaml
        after:
            - initrd
    image:
        files:
            - examples/pc-uki-image/image.yaml
        after:
            - uki

imager:
    boot: image

image:
    filename: pc-uki.img
    table: gpt
    secure-boot:
        private-key: examples/pc-uki-image/keys/db.key
        public-cert: examples/pc-uki-image/keys/db.crt
    partitions:
        - label: esp
          type: vfat
          size: 256MiB
          source: image
          where: /efi
          flags: [boot]
        - label: xbootldr
          type: vfat
          size: 512MiB
          source: image
          where: /boot
          flags: [xbootldr]
        - label: var
          type: ext4
          size: 1024MiB
          source: image
          where: /var
        - label: usr
          type: erofs
          size: 2048MiB
          source: image
          where: /usr
          verity: true
        - label: usr-verity
          type: verity-hash
          size: 64MiB
          source: image
          verity-for: usr
        - label: root
          type: ext4
          size: 1536MiB
          source: image
          where: /
