# A real-PC-sized disk chaining initrd -> UKI -> rootfs in one 'seine
# build' call (multiconfig: after:, docs/building.md). Secure Boot
# still needs to be off; the UKI is signed through a vault key.
#   seine build examples/pc-uki-image/main.yaml
#   dd if=build/deploy/trixie/pc-uki.img of=/dev/sdX bs=4M status=progress conv=fsync

