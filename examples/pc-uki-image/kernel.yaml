# Slim rebuild of linux-image-amd64 in place (see docs/kernels.md).
# Only in 'initrd': 'uki' comes after it and reuses the same .deb,
# so kernel and initrd modules keep the same ABI.

# Fixed dev-only throwaway key/cert, so two independent local builds
# sign with the same key instead of each generating their own -- the
# images would otherwise never be byte-identical. A remote vault
