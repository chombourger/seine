# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier: Apache-2.0

# Slim rebuild of linux-image-amd64 in place (see docs/kernels.md).
# Only in 'initrd': 'uki' comes after it and reuses the same .deb,
# so kernel and initrd modules keep the same ABI.

packages:
    - source: apt://linux
      extends:
          kernel:
              fragments:
                  - ../configs/slim-common.fragment
                  - ../configs/slim-amd64.fragment
              # Every module gets re-signed with this vault key after the
              # build (docs/kernels.md); kbuild's own signing key is left
              # at its Debian default and ignored.
              signing-key: vault:pc-uki-kernel-modules
      profiles:
          - pkg.linux.nokerneldbginfo
          - pkg.linux.mintools
          - pkg.linux.nosource
          - nodoc
          - noudeb
