packages:
    - source: apt://linux
      extends:
          kernel:
              fragments:
                  - ../configs/slim-common.fragment
                  - ../configs/slim-amd64.fragment
              # Every module gets re-signed with this vault key after the
              # build (docs/kernels.md); kbuild's own signing key is left
              # at its Debian default and ignored.
              signing-key: vault:pc-uki-kernel-modules
      profiles:
          - pkg.linux.nokerneldbginfo
          - pkg.linux.mintools
          - pkg.linux.nosource
          - nodoc
          - noudeb
