# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier Apache-2.0

requires:
    - ../common/amd64
    - ../common/bookworm
    - ../common/conf-accounts
    - ../common/conf-locales
    - ../common/pc-image
    - french
    - selinux

packages:
    - source: apt://linux
      extends:
          kernel:
              config:
                  - configs/slim.fragment
              flavour: amd64
      profiles:
          - pkg.linux.nokerneldbginfo
          - pkg.linux.notools
          - pkg.linux.nosource
          - nodoc
          - noudeb

playbook:
    - name: some great packages
      priority: 250
      tasks:
           - name: install utilities
             apt:
                 state: present
                 name:
                     - attr
                     - iputils-ping
           - name: install vim
             apt:
                 state: present
                 name:
                     - vim
