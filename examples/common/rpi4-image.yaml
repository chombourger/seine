# SPDX-License-Identifier: Apache-2.0

# raspi-firmware lives in non-free-firmware, which every suite of both
# releases carries. Asked for here rather than by writing a sources.list
# into the image: the component is added to the feeds the specification
# already has, whichever release and whatever URIs those are -- so this
# file names no suite and works on bookworm as it does on trixie, and a
# build from a snapshot takes the firmware from that snapshot too.
distribution:
    components: main non-free-firmware

playbook:
    - name: boot packages
      priority: 800
      tasks:
          - name: install the Raspberry Pi boot firmware and kernel
            apt:
                state: present
                name:
                    - raspi-firmware
                    - linux-image-arm64
          - name: boot the upstream (mainline) kernel directly, no u-boot needed
            lineinfile:
                path: /boot/firmware/config.txt
                line: upstream_kernel=1
                create: true

image:
    filename: rpi4-image.img
    table: gpt
    partitions:
        - label: firmware
          type: vfat
          where: /boot/firmware
          flags:
              - boot
              - primary
        - label: rootfs
          type: ext4
          where: /
          # kernel + modules push this well past the default 16MiB slack;
          # ext4's own journal/inode-table overhead needs headroom too
          extra: 128MiB
          flags:
              - primary
