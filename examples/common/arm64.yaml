# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier: Apache-2.0

distribution:
    architecture: arm64

# As amd64.yaml beside this: which kernel of this architecture is meant,
# for a specification that rebuilds one, without asking for a build.
defaults:
    packages:
        - source: apt://linux
          extends:
              kernel:
                  flavour: arm64
        # And that a module built for this architecture is built against
        # that kernel as well as the distribution's. Under 'defaults', so
        # it asks for nothing: an image that builds no kernel of its own
        # -- which is most of them -- drops this, and an image that
        # builds no modules never reads it at all.
        - name: nvidia-open
          extends:
              module:
                  arm64-kernels:
                      - linux

imager:
    kernel: linux-image-arm64
