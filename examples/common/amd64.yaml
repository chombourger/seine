# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier Apache-2.0

distribution:
    architecture: amd64

# Which kernel of this architecture is meant, for a specification that
# rebuilds one. Under 'defaults' rather than 'packages': naming a package
# there would ask for it to be built, and every amd64 image would rebuild
# a kernel whether it wanted one or not.
defaults:
    packages:
        - source: apt://linux
          extends:
              kernel:
                  flavour: amd64

imager:
    kernel: linux-image-amd64

playbook:
    - name: boot packages
      priority: 800
      tasks:
          - name: install grub packages
            apt:
                name:
                    - grub-efi-amd64
                    - grub-efi-amd64-signed
                state: present
          - name: install kernel and firmware blobs
            apt:
                name:
                    - linux-image-amd64
                    - firmware-linux-free
                state: present
