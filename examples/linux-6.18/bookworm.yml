# The 6.18.y kernel of kernel.yml beside this, built for bookworm:
#
#   ./seine.py build examples/common/bookworm.yaml \
#              examples/common/amd64.yaml         \
#              examples/common/pc-image.yaml      \
#              examples/linux-6.18/bookworm.yml
#
# bookworm's own kernel packaging predates the move to defines.toml and
# is too far from the tree being built. bookworm-backports carries a
# newer one, and a backport is by construction built on the suite it was
# backported to, so its build dependencies are what a bookworm chroot
# has; the same packaging taken from trixie would ask for a compiler
# bookworm does not carry.
#
# That is the whole of what bookworm needs saying about it, so it is the
# whole of this file. Backports is NotAutomatic, so the version has to be
# named: unpinned, apt would hand out bookworm's own kernel. The feed
# itself is listed by examples/common/bookworm.yaml, where the rest of
# the release's feeds are.
#
# trixie needs no file of its own: its own packaging builds this tree, so
# kernel.yml is used directly.

requires:
    - kernel

packages:
    - source: apt://linux=6.12.95-1~bpo12+1
