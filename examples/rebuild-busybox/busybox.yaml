# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier: Apache-2.0

# The rebuild on its own, naming neither a release, an architecture nor a
# board: what it says about busybox is true of all of them. main.yaml puts
# it on an amd64 pc-image, and anything else -- another board, another
# architecture, a test filling a cache -- composes it the same way, by
# listing the fragments it wants in front of this one.

packages:
    - source: apt://busybox
      profiles:
          - nocheck
      patches:
          - patches/0001-mark-the-banner-as-rebuilt.patch

playbook:
    - name: install the rebuilt busybox
      priority: 250
      tasks:
          - name: busybox
            apt:
                state: present
                name:
                    - busybox

# Proves the patch above actually landed on real hardware, not just
# that the package built -- 'Log In' is defined in conf-accounts.yaml,
# beside the password it uses, not here: this fragment says nothing
# about how to log in, only what to check once logged in. See
# docs/testing.md.
test:
    - name: busybox rebuild
      tags: [busybox, smoke]
      setup:
          connect_target: {}
      teardown:
          disconnect_target: {}
      tests:
          - name: banner shows the rebuild marker
            steps:
                - power_cycle: {settle: 2s}
                - log_in: {}
                - console_send: {data: "busybox | head -1\n"}
                - console_wait: {pattern: "rebuilt-by-seine", timeout: 15s, assign: MATCHED}
                - should_be_true: ["${MATCHED}"]
