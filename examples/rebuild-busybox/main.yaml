# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier: Apache-2.0

requires:
    - ../common/amd64
    - ../common/bookworm
    - ../common/pc-image

packages:
    - source: apt://busybox
      profiles:
          - nocheck
      patches:
          - patches/0001-mark-the-banner-as-rebuilt.patch

playbook:
    - name: install the rebuilt busybox
      priority: 250
      tasks:
          - name: busybox
            apt:
                state: present
                name:
                    - busybox
