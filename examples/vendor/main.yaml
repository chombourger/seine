# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier: Apache-2.0

# A local, signed apt repository of the source packages listed
# in core-sbom for bookworm and trixie, amd64 and arm64 -- not built
# into an image, just pinned so a rebuild years from now does not
# depend on the feeds still being up:
#
#   seine vendor examples/vendor/main.yaml
#
# add '--suite trixie' or '--suite bookworm' to vendor one of the two
# suites this asks for on its own, leaving the other untouched; add
# '--architecture amd64' or '--architecture arm64' likewise to narrow
# which architecture gets fetched (resolving still covers both --
# see docs/specification.md's 'vendor' section). Resolves every core
# source package (with its full build-dependency closure, deduped
# against the buildd chroot's own package set) and fetches it into
# ./build/cache/vendor/<suite>/, one repository per suite holding
# both architectures. Suites and architectures are filtered wisely:
# a package needed everywhere has no filter, one needed for a single
# release or architecture carries that suite/arch alone.
#
# No 'distribution: release:' here on purpose: this file merges into a
# real image specification too ('seine build pc-image.yaml vendor.yaml',
# say), and a release set here -- parsed after the image's own -- would
# win over it (see docs/specification.md: "the last parsed value will be
# used") and vendor a release the image was never built for. Standalone
# 'seine vendor' does not need it either: which suites to vendor comes
# from 'vendor:'s own entries and '--suite', not from 'distribution:
# release:'.
#
# Unsigned unless SEINE_VENDOR_SIGN_KEY/--vendor-sign-key names a key
# ('vault:seine-vendor-repo' against a real vault signs with the fixed
# dev-only throwaway below; a remote vault ignores it and fails closed
# on a miss instead, same as any other 'defaults: vault:' -- see
# docs/vault-openbao.md):
#   export SEINE_VAULT_ADDR=https://<your-host>:8200
#   export SEINE_VAULT_TOKEN=<a token that can read+sign seine-pgp/keys/seine-vendor-repo>
#   export SEINE_VENDOR_SIGN_KEY=vault:seine-vendor-repo
#   seine vendor examples/vendor/main.yaml
#
# Its own key, independent from 'packages:'/'sign-key''s
# (examples/common/custom-packages.yml: 'defaults: sign-key:
# vault:custom-packages') -- vendored packages were never built or
# audited by seine, so a compromise of one repository's key never lets
# an attacker slip something into the other.
