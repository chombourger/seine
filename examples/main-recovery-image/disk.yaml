# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier Apache-2.0

# Two independently-packaged operating systems on one disk -- 'main' is
# the everyday one, 'recovery' a small rescue environment. Each gets
# its own root partition; both share one ESP, with one GRUB boot entry
# per group ('main' first, since it owns the boot).
#   seine build examples/main-recovery-image/disk.yaml
distribution:
    release: trixie
    architecture: amd64

multiconfig:
    main:
        - examples/main-recovery-image/main.yaml
    recovery:
        - examples/main-recovery-image/recovery.yaml

image:
    filename: main-recovery.img
    table: gpt
    partitions:
        - label: esp
          type: vfat
          size: 64MiB
          source: main
          where: /efi
          flags: [boot, primary]
        - label: main-root
          type: ext4
          size: 1280MiB
          source: main
          where: /
        - label: recovery-root
          type: ext4
          size: 900MiB
          source: recovery
          where: /
